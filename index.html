<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DON FELIPE | Barbería</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}
.contenedor{
  max-width:500px;
  margin:auto;
  padding:25px 18px 40px;
}
.logo{
  width:110px;
  height:110px;
  border:2px solid #c9a45c;
  border-radius:50%;
  margin:0 auto 18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:#c9a45c;
  font-weight:bold;
}
.logo b{font-size:20px;line-height:.9}
.logo small{margin-top:10px;letter-spacing:2px}
h1{
  text-align:center;
  margin:0;
  font-size:34px;
  letter-spacing:2px;
}
.sub{
  text-align:center;
  color:#c9a45c;
  margin:7px 0 25px;
}
.card{
  background:#1c1c1c;
  border:1px solid #333;
  border-radius:16px;
  padding:18px;
}
label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}
select,input{
  width:100%;
  padding:14px;
  margin-bottom:16px;
  border-radius:10px;
  border:1px solid #444;
  background:#111;
  color:white;
  font-size:16px;
  box-sizing:border-box;
}
.horarios{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:18px;
}
.horario{
  padding:12px 5px;
  background:#242424;
  color:white;
  border:1px solid #555;
  border-radius:9px;
}
.horario.seleccionado{
  background:#c9a45c;
  color:#111;
  font-weight:bold;
}
.confirmar{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#25d366;
  color:#071b0d;
  font-size:16px;
  font-weight:bold;
}
.info{
  text-align:center;
  color:#999;
  font-size:13px;
  margin-top:18px;
}
</style>
</head>

<body>

<div class="contenedor">

<div class="logo">
  <b>DON<br>FELIPE</b>
  <small>since 2018</small>
</div>

<h1>DON FELIPE</h1>
<div class="sub">BARBERÍA · RESERVÁ TU TURNO</div>

<div class="card">

<label>Servicio</label>
<select id="servicio">
  <option>Corte de pelo</option>
  <option>Corte + barba</option>
  <option>Barba</option>
</select>

<label>Día</label>
<input type="date" id="fecha">

<label>Horario</label>
<div class="horarios" id="horarios"></div>

<label>Nombre</label>
<input type="text" id="nombre" placeholder="Tu nombre">

<label>Teléfono</label>
<input type="tel" id="telefono" placeholder="Tu teléfono">

<button class="confirmar" onclick="reservar()">
CONFIRMAR TURNO POR WHATSAPP
</button>

</div>

<div class="info">
DONDE SUCEDE LA MAGIA · since 2018<br>
El turno se confirma por WhatsApp.
</div>

</div>

<script>

const whatsapp="5493755271028";

const horarios=[
"08:00","09:00","10:00","11:00","12:00",
"15:00","16:00","17:00","18:00","19:00","19:30"
];

let horarioElegido="";

const contenedor=document.getElementById("horarios");

horarios.forEach(function(hora){

  const boton=document.createElement("button");

  boton.textContent=hora;
  boton.className="horario";
  boton.type="button";

  boton.onclick=function(){

    document.querySelectorAll(".horario")
      .forEach(b=>b.classList.remove("seleccionado"));

    boton.classList.add("seleccionado");

    horarioElegido=hora;
  };

  contenedor.appendChild(boton);
});

document.getElementById("fecha").min=
new Date().toISOString().split("T")[0];

function reservar(){

  const servicio=document.getElementById("servicio").value;
  const fecha=document.getElementById("fecha").value;
  const nombre=document.getElementById("nombre").value.trim();
  const telefono=document.getElementById("telefono").value.trim();

  if(!fecha || !horarioElegido || !nombre || !telefono){

    alert("Completá todos los datos y elegí un horario.");
    return;
  }

  const partes=fecha.split("-");

  const fechaFormateada=
  partes[2]+"/"+partes[1]+"/"+partes[0];

  const mensaje=
  "Hola Don Felipe! Quiero reservar un turno.%0A%0A"+
  "Servicio: "+encodeURIComponent(servicio)+"%0A"+
  "Día: "+fechaFormateada+"%0A"+
  "Horario: "+horarioElegido+"%0A"+
  "Nombre: "+encodeURIComponent(nombre)+"%0A"+
  "Teléfono: "+encodeURIComponent(telefono);

  window.open(
    "https://wa.me/"+whatsapp+"?text="+mensaje,
    "_blank"
  );
}

</script>

</body>
</html>
